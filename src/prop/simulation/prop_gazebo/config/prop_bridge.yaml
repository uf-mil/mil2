---
# ROS-Gazebo bridge for the prop boat simulation.
#
# The raw sensor topics land under /sim; sim_sensors.py stamps covariance on
# them and republishes /imu and /gps_raw, which is what the boat's own drivers
# publish.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/imu"
  gz_topic_name: "/sim/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/gps_raw"
  gz_topic_name: "/sim/gps_raw"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

- ros_topic_name: "/lidar/scan"
  gz_topic_name: "/lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Noise free pose and velocity, for comparing against the estimate.
- ros_topic_name: "/sim/ground_truth"
  gz_topic_name: "/sim/ground_truth"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Thrust in newtons, from sim_thrusters.py to the PropThrusters plugin.
- ros_topic_name: "/sim/thrust_left"
  gz_topic_name: "/prop/thrust/left"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/sim/thrust_right"
  gz_topic_name: "/prop/thrust/right"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
