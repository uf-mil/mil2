[workspace]
channels = ["robostack-jazzy", "conda-forge"]
name = "prop3"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]

[dependencies]
ros-jazzy-velodyne-driver = ">=2.5.1,<3"
ros-jazzy-velodyne-pointcloud = ">=2.5.1,<3"
ros-jazzy-rmw-zenoh-cpp = ">=0.2.10,<0.3"
ros-jazzy-ros-core = ">=0.11.0,<0.12"
ros-jazzy-pcl-ros = ">=2.6.5,<3"
ros-jazzy-rviz2 = ">=14.1.23,<15"
ros-jazzy-ros2bag = ">=0.26.11,<0.27"
python = ">=3.12,<3.13"
ros-jazzy-draco-point-cloud-transport = ">=4.0.4,<5"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-jazzy-control-toolbox = ">=4.11.0,<5"
ros-jazzy-robot-state-publisher = ">=3.3.4,<4"
ros-jazzy-robot-localization = ">=3.8.3,<4"
ros-jazzy-gps-msgs = ">=3.1.0,<4"

[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ROS_DOMAIN_ID = "37"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
LIBRARY_PATH = "$CONDA_PREFIX/lib:$LIBRARY_PATH"

[environments.prop-jetson.dependencies]
ros2-velodyne-pointcloud = ">=2.5.1,<3"
ros2-geographic-msgs = ">=1.0.6,<2"
ros2-imu-filter-madgwick = ">=2.1.5,<3"

[environments.prop-jetson.pypi-dependencies]
imufusion = ">=1.3.3, <2"
