/**:
  ros__parameters:
    # ─────────────────────────────────────────────────
    # Distance-pass-through filter
    # ─────────────────────────────────────────────────
    # Min/max radial distance from the sensor origin (metres).
    # Points closer than min_distance are considered sensor noise or
    # reflections off the hull; points beyond max_distance are too
    # sparse to be reliable.
    min_distance: 0.5        # [m]  reject points closer than this
    max_distance: 50.0       # [m]  reject points farther than this

    # ─────────────────────────────────────────────────
    # Water-surface rejection (Z / height filter)
    # ─────────────────────────────────────────────────
    # Points whose LEVELLED Z (see below) is below this threshold are
    # assumed to be water returns and are discarded.  Set relative to the
    # sensor frame (negative = below the lidar).
    #
    # The water sits ~0.52 m below the lidar at rest and ~0.49 m under thrust
    # (the hull squats). -0.5 cleared it by 2 cm, less than the sim lidar's own
    # 6 cm range noise, so ~440 water points a frame leaked through even with
    # the boat dead level. -0.40 leaves ~9 cm under thrust; on 235 captured
    # frames (level + turning), levelled, it left water clusters in 1.
    water_z_min: -0.40     # [m]  lower bound — reject water below this Z

    # Upper Z bound (optional sky/mast crop).  Set very large to disable.
    water_z_max: 10.0        # [m]  upper bound — reject sky noise above this Z

    # water_z_min/water_z_max are tested against a LEVELLED z (rotated by
    # roll and pitch), not the raw sensor-frame z, so the cut stays valid
    # while the hull is tilted. See pcl_filter.hpp's apply_z_filter.
    imu_topic: "/imu"        # sensor_msgs/Imu supplying roll/pitch
    attitude_max_age: 0.1    # [s]  IMU sample older than this vs. the cloud
                              #      is treated as missing; falls back to the
                              #      unlevelled cut rather than a stale one

    # ─────────────────────────────────────────────────
    # Voxel-grid down-sampling (pre-clustering)
    # ─────────────────────────────────────────────────
    voxel_leaf_size: 0.1     # [m]  leaf edge length; 0.0 disables down-sampling

    # ─────────────────────────────────────────────────
    # Euclidean cluster extraction
    # ─────────────────────────────────────────────────
    # Must exceed the gap between lidar rings on a target (2 deg apart: ~0.35 m
    # at 10 m), or each ring becomes its own cluster and none reaches
    # cluster_min_points. 0.1 split every buoy past ~5 m.
    cluster_tolerance: 0.5    # [m]  max neighbour distance for the same cluster
    # Counted AFTER the voxel grid, so this is occupied 10 cm cubes, not lidar
    # returns. One ring across a 0.5 m buoy fills ~5; the ~0.4 m of buoy above
    # water_z_min is crossed by 2-3 rings only inside ~10 m.
    cluster_min_points: 10    # minimum points to keep a cluster
    cluster_max_points: 25000 # maximum points allowed in a single cluster

    # ─────────────────────────────────────────────────
    # EKF tracker
    # ─────────────────────────────────────────────────
    # Frame in which cluster centroids are tracked (global coordinate frame).
    # Only extracted cluster centroids/bounding boxes are transformed into
    # this frame, leaving the full raw/filtered point cloud in the sensor frame.
    target_frame: "odom"

    # ─────────────────────────────────────────────────
    # I/O topics
    # ─────────────────────────────────────────────────
    input_topic: "/velodyne_points"
