/**:
  ros__parameters:
    # ─────────────────────────────────────────────────
    # Distance-pass-through filter
    # ─────────────────────────────────────────────────
    # Min/max radial distance from the sensor origin (metres).
    # Points closer than min_distance are considered sensor noise or
    # reflections off the hull; points beyond max_distance are too
    # sparse to be reliable.
    min_distance: 0.5        # [m]  reject points closer than this
    max_distance: 50.0       # [m]  reject points farther than this

    # ─────────────────────────────────────────────────
    # Water-surface rejection
    # ─────────────────────────────────────────────────
    # Measured from the water plane, not along the sensor's Z. The hull pitches,
    # and a gate tied to the sensor's own axis moves with it: at three degrees
    # the water twenty metres ahead sits ~0.4 m higher in sensor coordinates
    # than it does level, clears any fixed gate, and arrives downstream as an
    # obstacle. The plane is found from gravity_frame via TF each sweep.
    min_height_above_water: 0.17  # [m]  below this is water
    max_height_above_water: 10.0  # [m]  above this is sky or mast noise

    # Lidar height above the waterline, level. prop.urdf mounts it at 0.67.
    lidar_height: 0.67       # [m]

    # Any frame whose Z axis is up. Without it the hull is assumed level and
    # the gate behaves as it did before, which is wrong underway.
    gravity_frame: "odom"

    # ─────────────────────────────────────────────────
    # Voxel-grid down-sampling (pre-clustering)
    # ─────────────────────────────────────────────────
    voxel_leaf_size: 0.1     # [m]  leaf edge length; 0.0 disables down-sampling

    # ─────────────────────────────────────────────────
    # Euclidean cluster extraction
    # ─────────────────────────────────────────────────
    cluster_tolerance: 0.5    # [m]  max neighbour distance for the same cluster
    cluster_min_points: 15    # minimum points to keep a cluster
    cluster_max_points: 25000 # maximum points allowed in a single cluster

    # ─────────────────────────────────────────────────
    # I/O topics
    # ─────────────────────────────────────────────────
    input_topic: "/velodyne_points"
