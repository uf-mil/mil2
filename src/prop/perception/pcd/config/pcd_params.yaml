---
/**:
  ros__parameters:
    # ─────────────────────────────────────────────────
    # Distance-pass-through filter
    # ─────────────────────────────────────────────────
    # Min/max radial distance from the sensor origin (metres).
    # Points closer than min_distance are considered sensor noise or
    # reflections off the hull; points beyond max_distance are too
    # sparse to be reliable.
    min_distance: 1.0        # [m]  reject points closer than this
    max_distance: 10.0       # [m]  reject points farther than this

    # ─────────────────────────────────────────────────
    # Water-surface rejection (Z / height filter)
    # ─────────────────────────────────────────────────
    # Points whose Z coordinate is below this threshold are assumed
    # to be water returns and are discarded.  Set relative to the
    # sensor frame (negative = below the lidar).
    water_z_min: -0.5      # [m]  lower bound — reject water below this Z

    # Upper Z bound (optional sky/mast crop).  Set very large to disable.
    water_z_max: 10.0        # [m]  upper bound — reject sky noise above this Z

    # ─────────────────────────────────────────────────
    # Voxel-grid down-sampling (pre-clustering)
    # ─────────────────────────────────────────────────
    voxel_leaf_size: 0.02     # [m]  leaf edge length; 0.0 disables down-sampling

    # ─────────────────────────────────────────────────
    # Euclidean cluster extraction
    # ─────────────────────────────────────────────────
    cluster_tolerance: 0.05    # [m] max neighbour distance for the same cluster
    cluster_min_points: 50     # minimum points to keep a cluster
    cluster_max_points: 25000  # maximum points allowed in a single cluster
    # max (footprint / height) ratio
    cluster_flatness_threshold: 3.0

    # ─────────────────────────────────────────────────
    # EKF tracker
    # ─────────────────────────────────────────────────
    # Frame in which cluster centroids are tracked (global coordinate frame).
    # Only extracted cluster centroids/bounding boxes are transformed into
    # this frame, leaving the full raw/filtered point cloud in the sensor frame.
    target_frame: "odom"
    max_association_dist: 3.0   # [m] centroid gate for Hungarian assignment
    max_missed_frames: 10       # consecutive misses before a confirmed track is deleted
    max_missed_tentative: 2     # consecutive misses before a tentative track is deleted
    min_hits: 2                 # consecutive matches before a track is confirmed
    max_tracks: 20              # hard cap on live tracks
    max_detections: 50          # hard cap on merged detections consumed per frame
    merge_gap: 0.75             # [m] AABB gap below which detections are merged
    max_track_speed: 5.0        # [m/s] EKF velocity clamp

    # ─────────────────────────────────────────────────
    # I/O topics
    # ─────────────────────────────────────────────────
    input_topic: "/velodyne_points"
