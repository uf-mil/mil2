---
# Settings for the prop_maneuvers blocks. Every tunable lives here and nowhere
# else; constants.hpp declares them and is the only thing that reads them.
#
# Angles are DEGREES in this file and are converted to radians on load.
# They are measured from the front of the boat, with LEFT counting as positive:
#     0    straight ahead
#   +90    directly left
#  +/-180  directly behind
#   -90    directly right

/**:
  ros__parameters:

    # ── Hull and sensor geometry ─────────────────────────────────────────
    # CHANGE THESE IF THE LIDAR MOVES.
    #
    # Ranges the lidar cannot see through, as a flat list of from, to pairs.
    # Two mirrored wedges on the SIDES, where the pontoons block the view.
    # Measured by David, 2026-09-07, described on a clock face with the tips
    # of the pontoons at 12 and the thrusters at 6: blind from 3:00 to 4:30 on
    # the right, and 7:30 to 9:00 on the left.
    #
    # The boat CAN see straight out the back, through the gap between the
    # pontoons -- a 90 degree window centred on 180. Do not assume otherwise:
    # the previous value here was a guess of 70 degree wedges that left only a
    # 40 degree slot behind, which made reversing look blinder than it is.
    #
    # NOTE: where the lidar is physically bolted is deliberately NOT here. It
    # lives in prop_localization/urdf/prop.urdf and reaches this code through
    # the position chain at runtime, so a physical move is corrected in one
    # place only.
    #
    # How far the hull reaches from base_link. MEASURED on the boat by David,
    # 2026-09-08, with a tape from the edge of the lidar and converted to its
    # centre using the lidar's own 4 7/8 in diameter:
    #
    #   lidar radius              2 7/16 in   0.062 m
    #   edge -> front of boat        27 1/2 in   -> centre 0.760 m
    #   edge -> side                 15    in    -> centre 0.443 m
    #   back of lidar -> propellers  12    in    -> centre 0.367 m
    #
    # prop.urdf puts the lidar directly above base_link, so these are
    # base_link-relative as required. Total width works out at 0.886 m, inside
    # the 1 m the rules allow, which is a good check on the arithmetic.
    #
    # These replace guesses of 0.5 and 1.0 taken from the competition size box
    # with base_link assumed to sit in the middle of the boat. It does not:
    # it is 0.760 m from the front and 0.367 m from the propellers.
    #
    # CAVEAT on hull_behind: 0.367 m is to the PROPELLERS, and the pontoons
    # visibly extend further back than that in the photographs. When reversing,
    # the rearmost point is what strikes something, so this is optimistic.
    # Replace it with the distance to the pontoon tails when that is measured.
    hull_half_width: 0.443  # m, base_link to the side of the hull
    hull_behind: 0.367      # m, base_link to the propellers -- see caveat above
    hull_front: 0.760       # m, base_link to the front of the boat
    blind_spots_deg: [90.0, 135.0, -135.0, -90.0]
    use_blind_spots: true

    # ── Acquiring the target ─────────────────────────────────────────────
    # Used when no rough position is given and the block must pick the blob
    # "in front" of the boat by itself.
    acquire_cone_deg: 45.0      # half-angle of the forward cone
    acquire_max_range: 30.0     # m, ignore blobs further out than this

    # ── Matching a blob to the remembered point ──────────────────────────
    # Biggest thing we will believe is one object. The clustering normally
    # reports a 0.25 m buoy as about 0.18 m, but it occasionally merges
    # returns while the boat is moving: on 2026-09-07 it briefly reported a
    # radius of 9.3 m, which inflated the approach's standoff from 3.2 m to
    # 12.3 m and let it declare arrival while still 4.2 m out. Clamped rather
    # than rejected, because a too-big object should still be avoided -- it
    # just should not be trusted to size a standoff.
    max_object_radius: 1.5  # m
    # Two different jobs, deliberately two numbers.
    #
    # match_radius is for FINDING an object near a rough position the caller
    # supplied. Three metres of slack is right there -- the hint is a guess.
    match_radius: 3.0     # m, further than this from the prediction is a miss
    # refresh_max_jump is for TRACKING one we are already locked onto. The
    # buoys are bolted to the seabed: between refreshes a fifth of a second
    # apart, the remembered point should move by measurement noise and the
    # boat's own position error, nothing more. Sharing match_radius let a
    # phantom cluster 2.63 m away capture the lock mid-manoeuvre and hand the
    # approach a target that was not there.
    refresh_max_jump: 1.0 # m
    ambiguous_margin: 1.0 # m, two candidates closer than this is ambiguous
    reading_max_age: 5.0  # s, a lock older than this counts as stale

    # ── Distances ────────────────────────────────────────────────────────
    circle_radius: 6.0       # m, how far out to circle
    circle_legs: 4           # 4 gives the diamond; raise it if blind spots bite
    circle_counter_clockwise: true
    # Water left between the FRONT OF THE BOAT and the object's surface.
    #
    # Measured from the bow, not from base_link. base_link is the lidar, which
    # sits 0.760 m back from the bow, so a standoff measured there would leave
    # far less real clearance than it appears to promise: 1.0 m from base_link
    # would put the bow 0.24 m off the buoy. Same trap as measuring obstacle
    # clearance from the boat's centre instead of its hull.
    approach_standoff: 1.0   # m, bow to the object's surface

    # Both measured HULL to buoy SURFACE, so they mean what you would picture.
    #
    # min_gap decides only WHETHER to step around something, and the ceiling on
    # it is far tighter than it looks. Narrowest gate in the handbook is 1.83 m
    # between buoys (p45), so a buoy sits 0.915 m from the centreline. Not
    # detouring needs 0.915 >= buoy radius + hull_half_width + min_gap, i.e.
    #
    #     min_gap <= 0.915 - 0.23 - 0.50 = 0.185 m
    #
    # so 0.15 leaves THIRTY-FIVE MILLIMETRES of lateral error against the gate
    # centreline before the nearer buoy triggers a detour -- and a straddle on
    # a gate buoy is a collision, because the waypoint lands 0.10 m from the
    # far buoy's centre. Do not raise this number without redoing that sum.
    #
    # An earlier version of this comment said the bound was 0.65 m. That was
    # wrong: it omitted hull_half_width, carrying a centre-relative figure into
    # a hull-relative setting.
    #
    # The real lesson is that a gate cannot be driven by obstacle avoidance at
    # all -- it needs a behaviour that deliberately aims at the midpoint.
    # NOTE 1.83 m comes from a PRACTICE course; mission spacing is unpublished.
    min_gap: 0.15
    # How far out the detour actually swings, once one is needed.
    # Was 2.0 and measured from the boat's CENTRE, which was undeliverable --
    # 2 m from each buoy needs 4 m of room in a 1.83 m gate.
    detour_clearance: 1.0
    # How near the target a blob has to be to count as the target itself
    # rather than an obstacle to avoid. Was hardcoded in plan_route.
    target_blob_margin: 1.0

    # ── Reversing ────────────────────────────────────────────────────────
    # Used only to back away from something too close to swing around. The
    # boat can see straight out the back, so this is not a blind manoeuvre --
    # but it is capped anyway, because one recovery should not become a voyage.
    #
    # WATCH THE RATIO. A full-length reverse takes
    # reverse_max_distance / reverse_speed seconds, and at the values below
    # that is 2.0 / 0.4 = 5.0 s -- exactly reading_max_age. ApproachObject
    # refreshes the lock while backing off precisely so this does not abort
    # the approach on the clock alone, which is the same bug shape that once
    # cost a whole drive. If you lengthen the reverse or slow it down, keep
    # that refresh in mind, or give the ratio some real margin under
    # reading_max_age instead of relying on it.
    reverse_speed: 0.4          # m/s
    reverse_max_distance: 2.0   # m, cap on a single reverse

    # ── Tolerances ───────────────────────────────────────────────────────
    arrive_tolerance: 1.5       # m, close enough to count as arrived
    # How close to the requested standoff the approach must actually get.
    # Deliberately much tighter than arrive_tolerance: that one asks whether
    # the boat is near the goal WAYPOINT, which at 1.5 m against a 3.0 m
    # standoff let the approach stop half a standoff short and report success.
    # This one is measured against the object itself, which is what the
    # maneuver actually promises.
    standoff_tolerance: 0.3     # m
    point_tolerance_deg: 5.0    # how close counts as pointing at it

    # ── Turning ──────────────────────────────────────────────────────────
    turn_gain: 1.2              # turn rate commanded per radian of error
    max_turn_rate: 0.6          # rad/s cap, matches guidance

    # ── Giving up ────────────────────────────────────────────────────────
    maneuver_timeout: 300.0     # s of SIMULATED time before a maneuver fails
