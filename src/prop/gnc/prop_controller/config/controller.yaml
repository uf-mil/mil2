---
# Tuned against the Gazebo boat in prop_gazebo. max_thrust and thruster_y
# describe the hull, so they have to match models/prop/model.sdf and the real
# boat, not be tuned.

guidance:
  ros__parameters:
    rate: 10.0
    speed: 1.5
    lookahead: 3.0
    accept_radius: 1.0
    kp_heading: 1.2
    max_yaw_rate: 0.6 # rad/s
    hold_radius: 1.0 # m, station keeping deadband
    approach_gain: 0.5 # m/s per m remaining

thruster_manager:
  ros__parameters:
    rate: 20.0            # Hz
    command_timeout: 1.0  # s of cmd_vel silence before thrust is dropped
    max_thrust: 45.0      # N per thruster
    thruster_y: 0.25      # m off the centreline
    kp_surge: 60.0
    ki_surge: 30.0
    kp_yaw: 30.0
    ki_yaw: 15.0
