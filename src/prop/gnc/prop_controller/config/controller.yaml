---
guidance:
  ros__parameters:
    rate: 10.0
    speed: 1.5
    lookahead: 3.0
    accept_radius: 1.0
    kp_heading: 1.2
    max_yaw_rate: 0.6 # rad/s
    hold_radius: 0.10 # m, station keeping deadband
    yaw_tolerance: 0.09 # rad, ~5 deg, heading deadband once it is on the point
    approach_gain: 0.1 # m/s per m remaining

thruster_manager:
  ros__parameters:
    rate: 20.0
    command_timeout: 1.0 # s of cmd_vel silence before thrust is dropped
    max_force_pos: 55.21
    max_force_neg: 27.56
    thruster_y: 0.27305 # m off the centreline
    kp_surge: 70.0
    ki_surge: 15.0
    kp_yaw: 30.0
    ki_yaw: 15.0

# cmd_wrench from pid_controller -> an effort per thruster. The same numbers
# are on the Gazebo model, prop_gazebo/xacro/prop.sdf.xacro.
thruster_mapper:
  ros__parameters:
    thruster_y: 0.27305 # m off the centreline, the aft pair
    bow_x: 0.4 # m ahead of the centre of mass, the bow thruster
    max_force_pos: 55.21 # N, an aft thruster ahead
    max_force_neg: 27.56 # N, astern
    bow_force_pos: 51.5 # N, the bow T200 at 16 V to port
    bow_force_neg: 40.2 # N, to starboard
