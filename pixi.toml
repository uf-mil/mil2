[workspace]
channels = ["robostack-jazzy", "conda-forge"]
name = "prop3-pi"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12,<3.13"
ros-jazzy-ros-core = ">=0.11.0,<0.12"
ros-jazzy-rmw-zenoh-cpp = ">=0.2.9,<0.3"
pyubx2 = ">=1.3.6,<2"
pyserial = ">=3.5,<4"
ahrs = ">=0.4.0,<0.5"
ros-jazzy-robot-localization = ">=3.8.3,<4"
ros-jazzy-robot-state-publisher = ">=3.3.3,<4"
eigen = ">=5.0.1,<6"
colcon-common-extensions = ">=0.3.0,<0.4"
lttng-ust = ">=2.13.9,<3"
ros-jazzy-backward-ros = ">=1.0.7,<2"
ros-jazzy-control-toolbox = ">=4.11.0,<5"
ros-jazzy-nav2-util = ">=1.3.1,<2"
ros-jazzy-pcl-conversions = ">=2.6.2,<3"
gz-cmake3 = ">=3.5.5,<4"
gz-plugin2 = ">=2.0.4,<3"
gz-sim8 = ">=8.10.0,<9"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-vision-msgs = ">=4.1.1,<5"
ros-jazzy-behaviortree-cpp = ">=4.9.1,<5"

[target.linux-aarch64.pypi-dependencies]
bluerobotics-navigator = ">=0.1.2, <0.2"

[environments.basestation]
no-default-feature = true

[environments.basestation.dependencies]
evdev = ">=1.9.3,<2"
ros-jazzy-ros-core = ">=0.11.0,<0.12"

[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ROS_DOMAIN_ID = "37"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
LIBRARY_PATH = "$CONDA_PREFIX/lib:$LIBRARY_PATH"

